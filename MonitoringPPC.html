<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Monitoring PPC - Clean Light</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans leading-normal tracking-normal relative min-h-screen selection:bg-blue-500 selection:text-white">

    <!-- Header / Navbar Terang -->
    <header class="bg-white/90 backdrop-blur-md border-b border-gray-200 sticky top-0 z-40 shadow-sm">
        <div class="container mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-lg bg-gradient-to-tr from-blue-600 to-indigo-600 flex items-center justify-center shadow-md shadow-blue-500/20 text-white">
                    <span class="text-xl">✈️</span>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-wider text-gray-800">PPC CABIN DASHBOARD</h1>
                    <p class="text-xs text-gray-500">Cabin Status Monitoring</p>
                </div>
            </div>
            <div id="current-date" class="text-xs font-mono bg-blue-50 border border-blue-200 text-blue-700 px-4 py-2 rounded-lg shadow-inner"></div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="container mx-auto px-6 py-8 pb-24">
        
        <!-- Grid Layout: Tabel dan Grafik -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            
            <!-- Tabel Data -->
            <div class="bg-white border border-gray-200 rounded-xl shadow-md p-6 overflow-x-auto flex flex-col justify-between">
                <div>
                    <div class="flex justify-between items-center mb-6">
                        <h2 class="text-lg font-bold text-gray-800 tracking-wide flex items-center gap-2">
                            <span class="w-2.5 h-2.5 rounded-full bg-blue-600 animate-pulse"></span>
                            A/C Status Monitoring
                        </h2>
                    </div>
                    <table class="min-w-full divide-y divide-gray-200">
                        <thead>
                            <tr class="text-gray-500 font-mono text-[11px] bg-gray-50">
                                <th class="px-3 py-3 text-left uppercase tracking-wider">Registration</th>
                                <th class="px-3 py-3 text-left uppercase tracking-wider">JC</th>
                                <th class="px-3 py-3 text-left uppercase tracking-wider">MDR</th>
                                <th class="px-3 py-3 text-left uppercase tracking-wider">Plan RTS</th>
                                <th class="px-3 py-3 text-left uppercase tracking-wider">H- RTS</th>
                                <th class="px-3 py-3 text-left uppercase tracking-wider">Hilite</th>
                                <th class="px-3 py-3 text-center uppercase tracking-wider">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="plane-table-body" class="divide-y divide-gray-100 text-sm">
                            <!-- Data dimuat lewat JS -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Grafik Gabungan JC & MDR -->
            <div class="bg-white border border-gray-200 rounded-xl shadow-md p-6 flex flex-col justify-between">
                <h2 class="text-lg font-bold mb-4 text-gray-800 tracking-wide">Grafik JC & MDR per Registrasi</h2>
                <div class="w-full h-80 relative">
                    <canvas id="planeChart"></canvas>
                </div>
            </div>

        </div>
    </main>

    <!-- Floating Action Button (+) -->
    <div class="fixed bottom-6 left-6 z-40">
        <button onclick="toggleAddModal()" class="bg-blue-600 hover:bg-blue-700 text-white w-14 h-14 rounded-full shadow-lg shadow-blue-600/30 flex items-center justify-center text-3xl font-bold transition-all transform hover:scale-110 focus:outline-none">
            +
        </button>
    </div>

    <!-- Modal Pop-out Tambah Data -->
    <div id="add-modal" class="fixed inset-0 bg-gray-900/40 backdrop-blur-sm flex items-center justify-center hidden z-50 p-4">
        <div class="bg-white border border-gray-200 rounded-2xl shadow-2xl w-full max-w-md p-6 relative">
            <div class="flex justify-between items-center mb-4 border-b border-gray-100 pb-3">
                <h3 class="text-lg font-bold text-blue-600">Tambah Data Registrasi Baru</h3>
                <button onclick="toggleAddModal()" class="text-gray-400 hover:text-gray-600 font-bold text-xl">&times;</button>
            </div>
            <form id="plane-form">
                <div class="mb-4">
                    <label class="block text-xs font-mono uppercase text-gray-600 mb-1">A/C Reg.</label>
                    <input type="text" id="reg" placeholder="Contoh: PK-ABC" required class="w-full bg-gray-50 border border-gray-300 rounded-lg p-2.5 text-gray-800 focus:ring-2 focus:ring-blue-500 focus:outline-none uppercase font-mono">
                </div>
                <div class="grid grid-cols-2 gap-4 mb-4">
                    <div>
                        <label class="block text-xs font-mono uppercase text-gray-600 mb-1">JC (%)</label>
                        <input type="number" step="0.1" id="jc" placeholder="0 - 100" required class="w-full bg-gray-50 border border-gray-300 rounded-lg p-2.5 text-gray-800 focus:ring-2 focus:ring-blue-500 focus:outline-none font-mono">
                    </div>
                    <div>
                        <label class="block text-xs font-mono uppercase text-gray-600 mb-1">MDR (%)</label>
                        <input type="number" step="0.1" id="mdr" placeholder="0 - 100" required class="w-full bg-gray-50 border border-gray-300 rounded-lg p-2.5 text-gray-800 focus:ring-2 focus:ring-blue-500 focus:outline-none font-mono">
                    </div>
                </div>
                <div class="mb-4">
                    <label class="block text-xs font-mono uppercase text-gray-600 mb-1">Plan RTS</label>
                    <input type="date" id="rts" required class="w-full bg-gray-50 border border-gray-300 rounded-lg p-2.5 text-gray-800 focus:ring-2 focus:ring-blue-500 focus:outline-none font-mono">
                </div>
                <div class="mb-6">
                    <label class="block text-xs font-mono uppercase text-gray-600 mb-1">Hilite Notes</label>
                    <textarea id="hilite" rows="3" placeholder="Tulis catatan atau keterangan..." required class="w-full bg-gray-50 border border-gray-300 rounded-lg p-2.5 text-gray-800 focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm"></textarea>
                </div>
                <div class="flex justify-end space-x-3">
                    <button type="button" onclick="toggleAddModal()" class="bg-gray-100 hover:bg-gray-200 text-gray-700 font-semibold py-2 px-4 rounded-lg text-sm transition">Batal</button>
                    <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-5 rounded-lg text-sm transition shadow-md shadow-blue-500/20">Simpan Data</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal Pop-out Edit Data -->
    <div id="edit-modal" class="fixed inset-0 bg-gray-900/40 backdrop-blur-sm flex items-center justify-center hidden z-50 p-4">
        <div class="bg-white border border-gray-200 rounded-2xl shadow-2xl w-full max-w-md p-6 relative">
            <div class="flex justify-between items-center mb-4 border-b border-gray-100 pb-3">
                <h3 class="text-lg font-bold text-blue-600">Edit Data Pesawat</h3>
                <button onclick="closeEditModal()" class="text-gray-400 hover:text-gray-600 font-bold text-xl">&times;</button>
            </div>
            <form id="edit-form">
                <input type="hidden" id="edit-index">
                <div class="mb-4">
                    <label class="block text-xs font-mono uppercase text-gray-600 mb-1">A/C Reg.</label>
                    <input type="text" id="edit-reg" readonly class="w-full bg-gray-100 border border-gray-300 rounded-lg p-2.5 text-gray-400 cursor-not-allowed uppercase font-mono">
                </div>
                <div class="grid grid-cols-2 gap-4 mb-4">
                    <div>
                        <label class="block text-xs font-mono uppercase text-gray-600 mb-1">JC (%)</label>
                        <input type="number" step="0.1" id="edit-jc" required class="w-full bg-gray-50 border border-gray-300 rounded-lg p-2.5 text-gray-800 focus:ring-2 focus:ring-blue-500 focus:outline-none font-mono">
                    </div>
                    <div>
                        <label class="block text-xs font-mono uppercase text-gray-600 mb-1">MDR (%)</label>
                        <input type="number" step="0.1" id="edit-mdr" required class="w-full bg-gray-50 border border-gray-300 rounded-lg p-2.5 text-gray-800 focus:ring-2 focus:ring-blue-500 focus:outline-none font-mono">
                    </div>
                </div>
                <div class="mb-4">
                    <label class="block text-xs font-mono uppercase text-gray-600 mb-1">Plan RTS</label>
                    <input type="date" id="edit-rts" required class="w-full bg-gray-50 border border-gray-300 rounded-lg p-2.5 text-gray-800 focus:ring-2 focus:ring-blue-500 focus:outline-none font-mono">
                </div>
                <div class="mb-6">
                    <label class="block text-xs font-mono uppercase text-gray-600 mb-1">Hilite Notes</label>
                    <textarea id="edit-hilite" rows="3" required class="w-full bg-gray-50 border border-gray-300 rounded-lg p-2.5 text-gray-800 focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm"></textarea>
                </div>
                <div class="flex justify-end space-x-3">
                    <button type="button" onclick="closeEditModal()" class="bg-gray-100 hover:bg-gray-200 text-gray-700 font-semibold py-2 px-4 rounded-lg text-sm transition">Batal</button>
                    <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-5 rounded-lg text-sm transition shadow-md shadow-blue-500/20">Simpan Perubahan</button>
                </div>
            </form>
        </div>
    </div>

    <!-- JavaScript Aplikasi -->
    <script>
        function updateDate() {
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            const today = new Date();
            document.getElementById('current-date').innerText = "Updated On: " + today.toLocaleDateString('id-ID', options).toUpperCase();
        }
        updateDate();

        // Inisialisasi data: Mengambil dari LocalStorage, jika kosong pakai data default
        let planeData = JSON.parse(localStorage.getItem('planeData')) || [
            { reg: 'PK-GAA', jc: 12.5, mdr: 5.0, rts: '2026-06-15', hilite: 'Normal\nCheck Cabin A' },
            { reg: 'PK-GAB', jc: 3.2, mdr: 10.1, rts: '2026-06-20', hilite: 'Check Engine\nPending Part' }
        ];

        let planeChartInstance = null;

        function calculateHCountdown(rtsDateStr) {
            if (!rtsDateStr) return '-';
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const rtsDate = new Date(rtsDateStr);
            rtsDate.setHours(0, 0, 0, 0);

            // Perbaikan sintaks selisih hari
            const diffTime = rtsDate - today;
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

            if (diffDays > 0) {
                return `<span class="bg-blue-50 border border-blue-200 text-blue-700 text-xs font-mono font-bold px-2.5 py-1 rounded-md shadow-sm">H-${diffDays}</span>`;
            } else if (diffDays === 0) {
                return `<span class="bg-emerald-50 border border-emerald-200 text-emerald-700 text-xs font-mono font-bold px-2.5 py-1 rounded-md shadow-sm">H-0 (TODAY)</span>`;
            } else {
                return `<span class="bg-rose-50 border border-rose-200 text-rose-700 text-xs font-mono font-bold px-2.5 py-1 rounded-md shadow-sm">OVERDUE</span>`;
            }
        }

        function formatDateDisplay(dateStr) {
            if (!dateStr) return '-';
            const parts = dateStr.split('-');
            if (parts.length === 3) {
                return `${parts[2]}/${parts[1]}/${parts[0]}`;
            }
            return dateStr;
        }

        function renderApp() {
            const tbody = document.getElementById('plane-table-body');
            tbody.innerHTML = '';

            const regs = [];
            const jcData = [];
            const mdrData = [];

            planeData.forEach((item, index) => {
                regs.push(item.reg);
                jcData.push(item.jc);
                mdrData.push(item.mdr);

                const hCountdown = calculateHCountdown(item.rts);
                const displayRts = formatDateDisplay(item.rts);

                const row = document.createElement('tr');
                row.className = "hover:bg-blue-50/40 transition-colors";
                row.innerHTML = `
                    <td class="px-3 py-3.5 whitespace-nowrap font-mono font-bold text-blue-600">${item.reg}</td>
                    <td class="px-3 py-3.5 whitespace-nowrap text-gray-700 font-mono">${item.jc}%</td>
                    <td class="px-3 py-3.5 whitespace-nowrap text-gray-700 font-mono">${item.mdr}%</td>
                    <td class="px-3 py-3.5 whitespace-nowrap text-gray-700 font-mono text-xs">${displayRts}</td>
                    <td class="px-3 py-3.5 whitespace-nowrap">${hCountdown}</td>
                    <td class="px-3 py-3.5 text-gray-600 text-xs max-w-xs" style="white-space: pre-line;">${item.hilite}</td>
                    <td class="px-3 py-3.5 whitespace-nowrap text-center space-x-2">
                        <button onclick="openEditModal(${index})" title="Edit" class="text-blue-600 hover:text-blue-800 p-1 rounded transition">
                            <svg class="w-4 h-4 inline" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
                        </button>
                        <button onclick="deleteData(${index})" title="Hapus" class="text-rose-600 hover:text-rose-800 p-1 rounded transition">
                            <svg class="w-4 h-4 inline" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                        </button>
                    </td>
                `;
                tbody.appendChild(row);
            });

            // Menyimpan state data terbaru ke LocalStorage setiap render
            localStorage.setItem('planeData', JSON.stringify(planeData));
            updateChart(regs, jcData, mdrData);
        }

        function updateChart(regs, jc, mdr) {
            const ctx = document.getElementById('planeChart').getContext('2d');
            if (planeChartInstance) planeChartInstance.destroy();

            planeChartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: regs,
                    datasets: [
                        {
                            label: 'JC (%)',
                            data: jc,
                            backgroundColor: 'rgba(37, 99, 235, 0.8)',
                            borderColor: 'rgba(37, 99, 235, 1)',
                            borderWidth: 1,
                            borderRadius: 4
                        },
                        {
                            label: 'MDR (%)',
                            data: mdr,
                            backgroundColor: 'rgba(225, 29, 72, 0.8)',
                            borderColor: 'rgba(225, 29, 72, 1)',
                            borderWidth: 1,
                            borderRadius: 4
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            labels: {
                                color: '#374151',
                                font: { family: 'ui-sans-serif, system-ui', size: 11 }
                            }
                        }
                    },
                    scales: {
                        x: {
                            grid: { color: 'rgba(229, 231, 235, 1)' },
                            ticks: { color: '#4b5563', font: { family: 'monospace' } }
                        },
                        y: {
                            beginAtZero: true,
                            max: 100,
                            grid: { color: 'rgba(229, 231, 235, 1)' },
                            ticks: { color: '#4b5563' }
                        }
                    }
                }
            });
        }

        function toggleAddModal() {
            document.getElementById('add-modal').classList.toggle('hidden');
        }

        document.getElementById('plane-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const reg = document.getElementById('reg').value.toUpperCase().trim();
            const jc = parseFloat(document.getElementById('jc').value);
            const mdr = parseFloat(document.getElementById('mdr').value);
            const rts = document.getElementById('rts').value;
            const hilite = document.getElementById('hilite').value.trim();

            if (planeData.some(item => item.reg === reg)) {
                alert('Registrasi pesawat sudah ada dalam sistem!');
                return;
            }

            planeData.push({ reg, jc, mdr, rts, hilite });
            document.getElementById('plane-form').reset();
            toggleAddModal();
            renderApp();
        });

        function openEditModal(index) {
            const data = planeData[index];
            document.getElementById('edit-index').value = index;
            document.getElementById('edit-reg').value = data.reg;
            document.getElementById('edit-jc').value = data.jc;
            document.getElementById('edit-mdr').value = data.mdr;
            document.getElementById('edit-rts').value = data.rts || '';
            document.getElementById('edit-hilite').value = data.hilite;
            document.getElementById('edit-modal').classList.remove('hidden');
        }

        function closeEditModal() {
            document.getElementById('edit-modal').classList.add('hidden');
        }

        document.getElementById('edit-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const index = document.getElementById('edit-index').value;
            planeData[index].jc = parseFloat(document.getElementById('edit-jc').value);
            planeData[index].mdr = parseFloat(document.getElementById('edit-mdr').value);
            planeData[index].rts = document.getElementById('edit-rts').value;
            planeData[index].hilite = document.getElementById('edit-hilite').value.trim();

            closeEditModal();
            renderApp();
        });

        function deleteData(index) {
            if (confirm('Konfirmasi penghapusan data telemetri pesawat ini?')) {
                planeData.splice(index, 1);
                renderApp();
            }
        }

        // Jalankan render awal saat halaman dimuat
        renderApp();
    </script>
</body>
</html>
